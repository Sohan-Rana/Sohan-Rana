<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Animated cartoon avatar of Sohan Rana">
  <style>
    .bob   { animation: bob 3s ease-in-out infinite; }
    .blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .wave  { animation: wave 1.6s ease-in-out infinite; transform-origin: 285px 292px; }
    .spin  { animation: spin 20s linear infinite; transform-origin: 200px 200px; }
    .glow  { animation: glow 3s ease-in-out infinite; }
    .tag   { font-family: 'Courier New', monospace; font-weight: 700; fill: #c5ff4a; animation: float 4s ease-in-out infinite; }
    .t2 { animation-delay: -1.3s; }
    .t3 { animation-delay: -2.6s; }
    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes wave  { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes glow  { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(-9px); opacity: 1; } }
  </style>

  <defs>
    <clipPath id="circle"><circle cx="200" cy="200" r="188"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2c5364"/>
      <stop offset="1" stop-color="#0f2027"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <circle cx="200" cy="200" r="188" fill="url(#bg)"/>
  <circle class="glow" cx="200" cy="200" r="170" fill="none" stroke="#c5ff4a" stroke-width="1.5"/>

  <g clip-path="url(#circle)">
    <g class="bob">
      <!-- left arm -->
      <path d="M118 300 L104 372" stroke="#3a5a8c" stroke-width="30" stroke-linecap="round" fill="none"/>
      <!-- body -->
      <path d="M100 410 L100 308 Q100 268 146 258 L254 258 Q300 268 300 308 L300 410 Z" fill="#3a5a8c"/>
      <path d="M168 258 L232 258 L224 410 L176 410 Z" fill="#d3d7dc"/>
      <path d="M168 258 L176 410 M232 258 L224 410" stroke="#2b4468" stroke-width="3" fill="none"/>
      <!-- neck -->
      <path d="M182 232 L218 232 L220 266 Q200 282 180 266 Z" fill="#e8b48a"/>
      <!-- ears -->
      <ellipse cx="142" cy="196" rx="9" ry="15" fill="#e8b48a"/>
      <ellipse cx="258" cy="196" rx="9" ry="15" fill="#e8b48a"/>
      <!-- face -->
      <ellipse cx="200" cy="190" rx="58" ry="68" fill="#f0bd94"/>
      <!-- hair -->
      <path d="M140 178 Q136 112 202 108 Q266 112 260 178 Q252 144 200 142 Q148 144 140 178 Z" fill="#2a1d17"/>
      <path d="M152 140 Q176 98 222 112 Q250 122 256 150 Q236 128 204 130 Q170 130 152 150 Z" fill="#2a1d17"/>
      <!-- eyebrows -->
      <path d="M158 172 Q176 164 194 172" stroke="#2a1d17" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M206 172 Q224 164 242 172" stroke="#2a1d17" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- eyes -->
      <g class="blink">
        <circle cx="176" cy="192" r="5" fill="#1a1a1a"/>
        <circle cx="224" cy="192" r="5" fill="#1a1a1a"/>
      </g>
      <!-- glasses -->
      <rect x="156" y="177" width="40" height="30" rx="11" fill="#ffffff" fill-opacity="0.08" stroke="#1a1a1a" stroke-width="3.5"/>
      <rect x="204" y="177" width="40" height="30" rx="11" fill="#ffffff" fill-opacity="0.08" stroke="#1a1a1a" stroke-width="3.5"/>
      <path d="M196 189 L204 189" stroke="#1a1a1a" stroke-width="3.5" fill="none"/>
      <path d="M156 189 L144 186 M244 189 L256 186" stroke="#1a1a1a" stroke-width="3" fill="none"/>
      <!-- nose -->
      <path d="M200 196 Q195 212 204 214" stroke="#c98f66" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- smile -->
      <path d="M176 225 Q200 252 224 225 Q200 234 176 225 Z" fill="#ffffff" stroke="#8a4b3a" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- goatee -->
      <path d="M186 246 Q200 262 214 246 Q200 252 186 246 Z" fill="#2a1d17" opacity="0.85"/>

      <!-- waving arm -->
      <g class="wave">
        <path d="M285 292 L336 236" stroke="#3a5a8c" stroke-width="30" stroke-linecap="round" fill="none"/>
        <circle cx="342" cy="228" r="17" fill="#f0bd94"/>
      </g>
    </g>
  </g>

  <!-- rotating ring -->
  <circle class="spin" cx="200" cy="200" r="192" fill="none" stroke="#c5ff4a" stroke-width="3" stroke-dasharray="46 22" stroke-linecap="round"/>

  <!-- floating tags -->
  <text class="tag" x="52" y="118" font-size="26">&lt;/&gt;</text>
  <text class="tag t2" x="40" y="240" font-size="24">AI</text>
  <text class="tag t3" x="64" y="330" font-size="22">NLP</text>
</svg>
